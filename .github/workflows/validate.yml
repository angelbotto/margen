name: Validate library, skill and React
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Regenerar y verificar fuentes
        run: |
          python scripts/build.py
          python scripts/validate.py
          python scripts/test_contract.py
          python scripts/test_project_profile.py
          node scripts/test_review_store.cjs
          node scripts/test_themes.cjs
          python scripts/validate_skill.py
          python scripts/test_feedback.py
          python scripts/test_portability.py
          python scripts/test_automatic_updates.py
          python scripts/test_release.py
          python scripts/test_agent_connector.py
          python scripts/check_public_assets.py
          git diff --exit-code
      - name: Paquete portable
        run: python scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bottifact-portable
          path: |
            dist/bottifact-portable.zip
            dist/bottifact-portable.sha256
          retention-days: 14

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r portal/requirements.lock
      - run: pip install httpx==0.28.1
      - run: python -m unittest discover -s portal -t . -p 'test_*.py' -v
      - run: bash -n scripts/install.sh
      - run: node --check portal/static/memory.js && node --check portal/static/analytics.js && node --check portal/static/creator.js && node --check portal/static/interface.js && node --check portal/static/context-workbench.js && node --check portal/static/reader-workspace.js && node --check portal/static/reader-controls.js && node --check portal/static/library-controls.js && node --check portal/static/knowledge.js && node --check portal/static/app.js && node --check portal/static/bridge.js && node --check portal/static/login.js && node --check portal/static/install.js

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- packages/core/components/table-model.js
      - run: npm run build:demo
      - run: npm pack --workspace @bottifact/core --pack-destination /tmp && npm pack --workspace @bottifact/react --pack-destination /tmp
