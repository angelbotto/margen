name: Validate library, skill and React
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Regenerar y verificar fuentes
        run: |
          python scripts/build.py
          python scripts/validate.py
          python scripts/test_contract.py
          python scripts/test_sketch_diagram.py
          python scripts/test_project_profile.py
          node scripts/test_review_store.cjs
          node scripts/test_themes.cjs
          node --test scripts/test_chart_core.mjs
          python scripts/validate_skill.py
          python scripts/test_feedback.py
          python scripts/test_domain_share.py
          python scripts/test_portability.py
          python scripts/test_automatic_updates.py
          python scripts/test_release.py
          python scripts/test_agent_connector.py
          python scripts/check_public_assets.py
          git diff --exit-code
      - name: Paquete portable
        run: python scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottifact-portable
          path: |
            dist/bottifact-portable.zip
            dist/bottifact-portable.sha256
          retention-days: 14

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r portal/requirements.lock
      - run: pip install httpx==0.28.1
      - run: python -m unittest discover -s portal -t . -p 'test_*.py' -v
      - run: bash -n scripts/install.sh
      - run: node --check portal/static/workspace.js && node --check portal/static/memory.js && node --check portal/static/analytics.js && node --check portal/static/creator.js && node --check portal/static/interface.js && node --check portal/static/context-workbench.js && node --check portal/static/reader-workspace.js && node --check portal/static/reader-controls.js && node --check portal/static/library-controls.js && node --check portal/static/knowledge.js && node --check portal/static/app.js && node --check portal/static/bridge.js && node --check portal/static/domain-sharing.js && node --check portal/static/access.js && node --check portal/static/login.js && node --check portal/static/install.js

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- packages/core/components/table-model.js
      - run: npm run build:demo
      - run: npm pack --workspace @bottifact/core --pack-destination /tmp && npm pack --workspace @bottifact/react --pack-destination /tmp

  editorial-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Install portal test dependencies
        run: |
          pip install --require-hashes -r portal/requirements.lock
          pip install httpx==0.28.1
      - name: Check community creation and sharing
        run: python scripts/test_community_marketplace.py && python scripts/test_portal_shell.py && python scripts/test_developers_runtime_browser.py
      - name: Check file upload and reader action flows
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python scripts/test_upload_browser.py
          MARGEN_BROWSER=webkit python scripts/test_upload_browser.py
          python scripts/test_reader_actions_runtime.py
          python review/reader-actions-review/check_delta.py --browsers chromium --out /tmp/margen-reader-actions-ci
          python scripts/test_contract_footer.py

      - name: Check shared reading rhythm
        run: |
          python scripts/test_editorial_flow.py
          python scripts/test_narrative_tables.py

      - name: Check measured editorial components and optional web shell
        run: |
          python scripts/test_editorial_reference.py
          python scripts/test_editorial_web.py

      - name: Check atlas layers, syntax and hidden prototype sizing
        run: |
          python scripts/test_editorial_atlas.py
          python scripts/test_code_syntax.py
          MARGEN_BROWSER=webkit python scripts/test_code_syntax.py
          python scripts/test_prototype_resize.py
          python scripts/test_deferred_runtime.py
          MARGEN_BROWSER=webkit python scripts/test_deferred_runtime.py
      - name: Check independently reported reader and chart regressions
        run: |
          python scripts/test_chart_edges.py
          python review/atlas-ui-runtime/test_defects.py
          MARGEN_BROWSER=webkit python review/atlas-ui-runtime/test_defects.py
      - name: Check portal-owned media intent with real browser clicks
        run: |
          python tests/evidence/atlas-media-intent-2026-10-22/media_intent_browser.py . /tmp/media-intent-ci /tmp/media-intent-shots chromium
          python tests/evidence/atlas-media-intent-2026-10-22/media_intent_browser.py . /tmp/media-intent-ci /tmp/media-intent-shots webkit
          python tests/evidence/atlas-final-delta-20261022/media_doubleclick_browser.py . /tmp/media-repeat-ci chromium
          python tests/evidence/atlas-final-delta-20261022/media_doubleclick_browser.py . /tmp/media-repeat-ci webkit
      - name: Check complete atlas offline in Chromium and WebKit
        run: |
          python scripts/build_atlas.py --output-dir /tmp/margen-atlas-ci --render
          python scripts/check_component_atlas.py --html /tmp/margen-atlas-ci/atlas.html --coverage /tmp/margen-atlas-ci/coverage.json --output /tmp/margen-atlas-ci/chromium --browser chromium
          python scripts/check_component_atlas.py --html /tmp/margen-atlas-ci/atlas.html --coverage /tmp/margen-atlas-ci/coverage.json --output /tmp/margen-atlas-ci/webkit --browser webkit
          python scripts/check_charts_atlas.py /tmp/margen-atlas-ci/atlas.html /tmp/margen-atlas-ci/charts.json
      - name: Preserve visual failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: editorial-layer-failure
          path: /tmp/margen-atlas-layer-proof
          if-no-files-found: ignore
          retention-days: 7
